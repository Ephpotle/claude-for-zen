<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- A generated card may style itself and run its own scripts (run by card.js), and nothing else: no network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:" />
    <meta name="color-scheme" content="light dark" />
    <script src="card.js" defer></script>
  </head>
  <body></body>
</html>
