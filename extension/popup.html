<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.45 system-ui, sans-serif;
        margin: 0;
        padding: 14px 16px;
        width: 260px;
        color: #1f1e1d;
        background: #faf9f5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f0eee6;
          background: #262624;
        }
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #9a9892;
        flex: none;
      }
      #dot.on {
        background: #d97757;
      }
      p {
        margin: 8px 0 0;
        opacity: 0.8;
      }
      hr {
        border: 0;
        border-top: 1px solid rgba(128, 128, 128, 0.3);
        margin: 12px 0;
      }
      button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        font: inherit;
        color: inherit;
        padding: 6px 10px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 7px;
        background: none;
        cursor: pointer;
      }
      button:hover {
        border-color: #d97757;
      }
      kbd {
        font: 11px system-ui, sans-serif;
        opacity: 0.6;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 10px;
        cursor: pointer;
      }
      #update-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #version {
        opacity: 0.7;
      }
      #update {
        width: auto;
        padding: 4px 10px;
      }
      #update:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label input {
        margin: 3px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Claude for Zen</h1>
    <div id="status"><span id="dot"></span><span id="label">Checking…</span></div>
    <p id="hint"></p>
    <hr />
    <button id="comment" type="button">Comment on this page <kbd>Alt+Shift+C</kbd></button>
    <label><input id="explain" type="checkbox" /> Show an Explain button when I select text</label>
    <hr />
    <div id="update-row"><span id="version"></span><button id="update" type="button">Check for updates</button></div>
    <p id="update-note" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
