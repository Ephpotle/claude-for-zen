<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="token" content="__TOKEN__" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude for Zen</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>Claude for Zen</h1>
      <button id="comment" type="button" title="Comment on the page: click a part of it and leave a note for Claude" aria-label="Comment on the page">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 3.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3v-3H4.5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" />
          <path d="M10 6.5v5M7.5 9h5" />
        </svg>
      </button>
      <button id="history-toggle" type="button" aria-expanded="false" aria-controls="history">History</button>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">Access</button>
      <button id="new" type="button" title="Forget this conversation and start over">New chat</button>
    </header>

    <section id="history" hidden>
      <ul id="history-list"></ul>
      <p id="history-empty" hidden>No earlier conversations yet. Each chat is kept here once you start a new one.</p>
    </section>

    <form id="settings" hidden>
      <fieldset>
        <legend>What Claude can use in this conversation</legend>
        <label><input type="radio" name="access" value="browser" /> <span><b>Browser only</b> Pages and tabs in Zen. Nothing on your computer.</span></label>
        <label><input type="radio" name="access" value="ask" /> <span><b>Browser and computer, asking first</b> Files and commands too. Commands and file changes wait for your OK here.</span></label>
        <label><input type="radio" name="access" value="full" /> <span><b>Browser and computer, without asking</b> Runs commands and changes files straight away. A web page that tricks Claude could then reach your files.</span></label>
        <label id="access-all-row"><input id="access-all" type="checkbox" /> <span><b>Use this in every conversation</b> Otherwise the choice above is for this conversation only, and a new chat starts with the browser only.</span></label>
      </fieldset>
      <label id="spaces-row"><input id="spaces" type="checkbox" /> <span><b>Zen itself: Spaces, tabs and uBlock</b> List, create and reorganise Spaces, folders and tabs, and tune uBlock Origin for the site you are on. Looking is free; every change waits for your OK here. Needs Zen started with the "Zen (Claude control)" shortcut.</span></label>
      <label id="scripts-row"><input id="scripts" type="checkbox" /> <span><b>Violentmonkey userscripts</b> Make a change to a page permanent by saving it as a userscript, and manage the ones you have. Saving, switching and removing always wait for your OK here. Needs Violentmonkey 2.50 or newer.</span></label>
      <label id="script-updates-row"><input id="script-updates" type="checkbox" /> <span><b>Update saved scripts without asking</b> Once you have allowed a script, Claude can change that script's code straight away, as long as its header (where it runs, what it may use, where it updates from) stays the same. New scripts and any header change still ask.</span></label>
      <div id="model-row">
        <label>Model
          <select id="model">
            <option value="">Default</option>
            <option value="fable">Fable</option>
            <option value="opus">Opus</option>
            <option value="sonnet">Sonnet</option>
            <option value="haiku">Haiku</option>
          </select>
        </label>
        <label>Effort
          <select id="effort">
            <option value="">Default</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="xhigh">Extra high</option>
            <option value="max">Max</option>
          </select>
        </label>
      </div>
      <label id="folder-row">
        Working folder for files
        <input id="folder" type="text" placeholder="e.g. C:\Users\you\Projects" spellcheck="false" autocomplete="off" />
      </label>
      <p id="settings-problem" hidden></p>
      <p id="looks">Look: <button type="button" data-theme="">Sage</button> <button type="button" data-theme="iris">Iris</button> <button type="button" data-theme="reader">Reader</button> <button type="button" data-theme="ledger">Ledger</button></p>
    </form>

    <main id="log" aria-live="polite">
      <section id="empty">
        <p>Ask about the page beside this panel, or tell Claude what to do on it.</p>
        <ul>
          <li><button type="button">Summarise this page</button></li>
          <li><button type="button">What can I do on this page?</button></li>
          <li><button type="button">Check this page's console for errors</button></li>
        </ul>
      </section>
    </main>

    <p id="notice" hidden></p>
    <p id="offline" hidden>Lost contact with the chat server. Reconnecting…</p>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message Claude" aria-label="Message Claude" autofocus></textarea>
      <button id="action" type="submit">Send</button>
    </form>

    <script src="/markdown.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
